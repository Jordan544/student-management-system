<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Event Deletion - SMS</title>
    <style>
        :root { --primary: #1E3A8A; --bg: #F8FAFC; --text: #334155; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; }
        .card-container { max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); border-top: 5px solid #DC2626; }
        h2 { color: #DC2626; margin-bottom: 10px; font-size: 20px; }
        p { font-size: 14px; color: #64748B; margin-bottom: 20px; }
        .event-box { background: #F8FAFC; border-left: 4px solid var(--primary); padding: 12px; border-radius: 6px; margin-bottom: 20px; }
        .btn-danger { background-color: #DC2626; color: white; padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-danger:hover { background-color: #B91C1C; }
        .btn-secondary { background-color: #E2E8F0; color: #475569; padding: 10px 18px; border-radius: 6px; font-weight: 600; text-decoration: none; display: inline-block; margin-left: 10px; }
        .btn-secondary:hover { background-color: #CBD5E1; }
    </style>
</head>
<body>
    <div class="card-container">
        <h2>Delete School Event?</h2>
        <p>Are you sure you want to remove this event from the school calendar? This action cannot be undone.</p>
        
        <div class="event-box">
            <strong>{{ event.title }}</strong>
            <div style="font-size: 12px; color: #2563EB; font-weight: 600; margin-top: 3px;">📅 {{ event.event_date|date:"F d, Y" }}</div>
        </div>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Yes, Delete Event</button>
            <a href="{% url 'dashboard' %}" class="btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
